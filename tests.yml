name: tests
on: [push, pull_request]
jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cai Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave
      - name: Chay kiem thu
        run: octave --no-gui --eval "addpath('tests'); run_tests"
